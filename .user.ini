; Scoped to this app only (php8.4-fpm reads .user.ini per-directory).
; The FPI form posts up to 4 KYC documents; FpiController validates each at
; max:5120 (5 MB), so PHP must allow at least that much or the request is
; rejected with a 413 before Laravel's own validation can report it.
upload_max_filesize = 8M
post_max_size = 64M
